<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saavan Katha Admin Video Upload — Acharya Shamik Pathak Ji</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0f13;
      --card-bg: #181820;
      --primary-orange: #FF6B00;
      --primary-hover: #FF8800;
      --text-main: #FFFFFF;
      --text-muted: #A0A0B0;
      --border-color: #2D2D3A;
      --success-green: #00E676;
      --error-red: #FF3D00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 107, 0, 0.15);
      color: var(--primary-orange);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 107, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="password"],
    textarea {
      width: 100%;
      background: #101016;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary-orange);
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .col {
      flex: 1;
    }

    .file-drop {
      background: #101016;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .file-drop:hover {
      border-color: var(--primary-orange);
    }

    .file-drop input {
      display: none;
    }

    .file-drop-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    .file-name {
      margin-top: 8px;
      font-size: 13px;
      color: var(--primary-orange);
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, #FF6B00, #FF8800);
      color: #FFF;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .progress-bar-wrap {
      width: 100%;
      background: #101016;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary-orange);
      width: 0%;
      transition: width 0.2s;
    }

    .status-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .status-success { color: var(--success-green); }
    .status-error { color: var(--error-red); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">Bunny.net CDN Stream Upload</span>
      <h1>Acharya Shamik Pathak Ji — Saavan Katha</h1>
      <p class="subtitle">Upload Katha videos to Bunny.net storage path (katha/acharya_shamik/saavan_katha/)</p>
    </div>

    <form id="uploadForm">
      <div class="row">
        <div class="col form-group">
          <label for="adminUsername">Admin Username</label>
          <input type="text" id="adminUsername" value="Admin" required />
        </div>
        <div class="col form-group">
          <label for="adminPassword">Admin Password</label>
          <input type="password" id="adminPassword" value="pummi9-mydwyj-cisfIw" required />
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="episodeNumber">Episode Number</label>
          <input type="number" id="episodeNumber" value="1" min="1" required />
        </div>
        <div class="col form-group">
          <label for="date">Broadcast Date</label>
          <input type="date" id="date" value="2026-08-13" required />
        </div>
      </div>

      <div class="form-group">
        <label for="title">Episode Title</label>
        <input type="text" id="title" placeholder="e.g. Saavan Katha Day 1 — Shiv Mahima & Mangalacharan" required />
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="guruName">Spiritual Guru</label>
          <input type="text" id="guruName" value="Acharya Shamik Pathak Ji" required />
        </div>
        <div class="col form-group">
          <label for="duration">Video Duration</label>
          <input type="text" id="duration" value="00:30:00" placeholder="HH:MM:SS" required />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Episode Description</label>
        <textarea id="description" rows="3" placeholder="Brief summary of today's Katha..."></textarea>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>Katha Video File (mp4, mov, mkv, webm, avi, etc.)</label>
          <div class="file-drop" onclick="document.getElementById('videoFile').click()">
            <div class="file-drop-text">📁 Click to select Video File</div>
            <div class="file-name" id="videoFileName">No file selected</div>
            <input type="file" id="videoFile" accept="video/*" required onchange="document.getElementById('videoFileName').innerText = this.files[0] ? this.files[0].name : 'No file selected'" />
          </div>
        </div>

        <div class="col form-group">
          <label>Thumbnail Image (Optional)</label>
          <div class="file-drop" onclick="document.getElementById('thumbFile').click()">
            <div class="file-drop-text">🖼️ Click to select Thumbnail</div>
            <div class="file-name" id="thumbFileName">Default cover image</div>
            <input type="file" id="thumbFile" accept="image/*" onchange="document.getElementById('thumbFileName').innerText = this.files[0] ? this.files[0].name : 'Default cover image'" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Upload Episode to Bunny.net</button>
    </form>

    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const adminUsername = document.getElementById('adminUsername').value;
      const adminPassword = document.getElementById('adminPassword').value;
      const episodeNumber = document.getElementById('episodeNumber').value;
      const date = document.getElementById('date').value;
      const title = document.getElementById('title').value;
      const guruName = document.getElementById('guruName').value;
      const duration = document.getElementById('duration').value;
      const description = document.getElementById('description').value;
      const videoFile = document.getElementById('videoFile').files[0];
      const thumbFile = document.getElementById('thumbFile').files[0];

      if (!videoFile) {
        alert('Please select a video file.');
        return;
      }

      const btnSubmit = document.getElementById('btnSubmit');
      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const statusMsg = document.getElementById('statusMsg');

      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Authenticating Admin...';
      progressWrap.style.display = 'block';
      progressFill.style.width = '10%';
      statusMsg.className = 'status-msg';
      statusMsg.innerText = 'Logging into Admin Panel...';

      try {
        // Step 1: Login to get Admin JWT token
        const loginRes = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: adminUsername, password: adminPassword })
        });

        if (!loginRes.ok) {
          throw new Error('Admin authentication failed. Please check username & password.');
        }

        const loginData = await loginRes.json();
        const token = loginData.token;

        statusMsg.innerText = 'Uploading video file directly to Bunny.net CDN storage...';
        btnSubmit.innerText = 'Uploading to Bunny.net...';

        const formData = new FormData();
        formData.append('title', title);
        formData.append('description', description);
        formData.append('episode_number', episodeNumber);
        formData.append('date', date);
        formData.append('guru_name', guruName);
        formData.append('duration', duration);
        formData.append('file', videoFile);
        if (thumbFile) formData.append('thumbnail', thumbFile);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/katha/admin/upload', true);
        xhr.setRequestHeader('Authorization', 'Bearer ' + token);

        xhr.upload.onprogress = (evt) => {
          if (evt.lengthComputable) {
            const percent = Math.round((evt.loaded / evt.total) * 100);
            progressFill.style.width = percent + '%';
            statusMsg.innerText = `Uploading to Bunny.net: ${percent}% completed...`;
          }
        };

        xhr.onload = () => {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Upload Episode to Bunny.net';
          if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            statusMsg.className = 'status-msg status-success';
            statusMsg.innerText = '✅ Day ' + episodeNumber + ' Katha video uploaded successfully to Bunny.net! CDN Link: ' + res.episode.video_url;
            progressFill.style.width = '100%';
          } else {
            statusMsg.className = 'status-msg status-error';
            statusMsg.innerText = '❌ Upload failed: ' + xhr.responseText;
          }
        };

        xhr.onerror = () => {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Upload Episode to Bunny.net';
          statusMsg.className = 'status-msg status-error';
          statusMsg.innerText = '❌ Network error during upload.';
        };

        xhr.send(formData);

      } catch (err) {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Upload Episode to Bunny.net';
        statusMsg.className = 'status-msg status-error';
        statusMsg.innerText = '❌ Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
