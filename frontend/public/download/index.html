  <script>
    // Universal Smart Redirect with UTM attribution
    (function() {
      var search = window.location.search || '';
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(userAgent);

      // Extract and format UTM referrer
      var queryParams = search.replace(/^\?/, '');
      var playStoreUrl = 'https://play.google.com/store/apps/details?id=com.brahmand.app';
      if (queryParams) {
        playStoreUrl += '&referrer=' + encodeURIComponent(queryParams);
      }

      // If mobile user on Android, forward immediately to Play Store with referrer
      if (isAndroid) {
        window.location.replace(playStoreUrl);
      }
    })();
  </script>
