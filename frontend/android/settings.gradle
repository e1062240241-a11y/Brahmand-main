pluginManagement {
  def getNodeBinary = {
    if (System.getenv("NODE_BINARY") != null) {
      return System.getenv("NODE_BINARY")
    }
    def candidates = ["/usr/local/bin/node", "/opt/homebrew/bin/node"]
    for (candidate in candidates) {
      if (new File(candidate).exists()) return candidate
    }
    def userHome = System.getProperty("user.home")
    def nvmDir = new File(userHome, ".nvm/versions/node")
    if (nvmDir.exists() && nvmDir.isDirectory()) {
      def versions = nvmDir.listFiles()
      if (versions != null && versions.length > 0) {
        versions.sort { a, b -> b.name <=> a.name }
        def nvmNode = new File(versions[0], "bin/node")
        if (nvmNode.exists()) return nvmNode.absolutePath
      }
    }
    try {
      def p = ["/bin/sh", "-c", "export PATH=\"\$PATH:/usr/local/bin:/opt/homebrew/bin:\$HOME/.nvm/versions/node/\$(ls \$HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin\"; command -v node"].execute()
      def res = p.text.trim()
      if (p.exitValue() == 0 && !res.isEmpty()) return res
    } catch (Exception ignored) {}
    return "node"
  }

  def nodeBin = getNodeBinary()

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeBin, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeBin, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Brahmand'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
