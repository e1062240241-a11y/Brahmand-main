name: Deploy Staging to GCP

on:
  push:
    branches:
      - brahmand-staging

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: brahmand-staging-2026

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Create Firebase Config File
        env:
          FIREBASE_KEY_DATA: ${{ secrets.FIREBASE_KEY }}
        run: |
          printf '%s' "$FIREBASE_KEY_DATA" > backend/firebase.json

      - name: Run Deploy Script
        run: |
          chmod +x deploy-gcp-full.sh
          ./deploy-gcp-full.sh brahmand-staging-2026
